spring.application.name=email

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/msjava-email?currentSchema=core
spring.datasource.username=admin
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.schemas=core
spring.flyway.default-schema=core
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true

spring.rabbitmq.addresses=amqp://admin:123456@msjava-broker:5672
broker.queue.email.name=default.email

spring.mail.host=smtp.mail.com
spring.mail.port=
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
